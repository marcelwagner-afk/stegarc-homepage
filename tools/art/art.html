<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0}canvas{display:block}</style></head><body>
<canvas id="c"></canvas>
<script>
/* Eigene, prozedural erzeugte Bildwelt der Homepage (keine Fotos, keine Fremdquellen).
   Aufruf: art.html?k=<motiv>&t=light|dark&w=<px>&h=<px>&s=<seed>  – gerendert von render.py */
const P = new URLSearchParams(location.search), K = P.get("k"), DARK = P.get("t") === "dark", W = +P.get("w"), H = +P.get("h");
let sd = +(P.get("s") || 1) * 9301 + 49297; const R = () => (sd = (sd * 9301 + 49297) % 233280) / 233280;
const c = document.getElementById("c"), x = c.getContext("2d"); c.width = W; c.height = H;
const TEAL = [0, 184, 176], CY = [94, 230, 219], NAVY = [7, 21, 43];
const rgba = (k, a) => `rgba(${k[0]},${k[1]},${k[2]},${a})`;
const BG = DARK ? "#07152B" : "#F8F9FA";
function lin(x0, y0, x1, y1, stops) { const g = x.createLinearGradient(x0, y0, x1, y1); stops.forEach(([o, col]) => g.addColorStop(o, col)); return g; }
function sky() {
  x.fillStyle = DARK ? lin(0, 0, W, H, [[0, "#081a33"], [.6, "#07152B"], [1, "#04101f"]]) : lin(0, 0, 0, H, [[0, "#e6eff4"], [.55, "#f3f7f9"], [1, "#F8F9FA"]]);
  x.fillRect(0, 0, W, H);
}
function glowAt(cx, cy, r, col, a) { const g = x.createRadialGradient(cx, cy, 0, cx, cy, r); g.addColorStop(0, rgba(col, a)); g.addColorStop(1, rgba(col, 0)); x.fillStyle = g; x.fillRect(0, 0, W, H); }
function fadeLeft(to) { x.fillStyle = lin(0, 0, W, 0, [[0, BG], [to, DARK ? "rgba(7,21,43,0)" : "rgba(248,249,250,0)"]]); x.fillRect(0, 0, W, H); }

/* Glasturm in Fluchtperspektive */
function tower(xl, xr, top, bottom, vx, vy, tint, light) {
  const q = [[xl, bottom], [xr, bottom], [xr + (vx - xr) * top, bottom + (vy - bottom) * top], [xl + (vx - xl) * top, bottom + (vy - bottom) * top]];
  const g = lin(q[0][0], q[3][1], q[1][0], q[0][1], DARK
    ? [[0, `rgba(60,140,180,${.35 * tint})`], [.5, `rgba(14,40,70,${.75 * tint})`], [1, `rgba(5,16,32,${.9 * tint})`]]
    : [[0, `rgba(250,252,253,${.95 * tint})`], [.3, `rgba(170,198,214,${.95 * tint})`], [.65, `rgba(112,148,170,${.9 * tint})`], [1, `rgba(190,210,222,${.95 * tint})`]]);
  x.beginPath(); q.forEach((p, i) => i ? x.lineTo(...p) : x.moveTo(...p)); x.closePath(); x.fillStyle = g; x.fill();
  x.save(); x.clip();
  const rows = 26, cols = 6; x.lineWidth = 1;
  x.strokeStyle = DARK ? "rgba(120,200,230,.16)" : "rgba(255,255,255,.75)";
  for (let r = 1; r < rows; r++) { const t = r / rows * top; const a = [xl + (vx - xl) * t, bottom + (vy - bottom) * t], b = [xr + (vx - xr) * t, bottom + (vy - bottom) * t]; x.beginPath(); x.moveTo(...a); x.lineTo(...b); x.stroke(); }
  for (let k = 1; k < cols; k++) { const u = k / cols, b0 = xl + (xr - xl) * u, tx = b0 + (vx - b0) * top, ty = bottom + (vy - bottom) * top; x.beginPath(); x.moveTo(b0, bottom); x.lineTo(tx, ty); x.stroke(); }
  // Spiegelung (diagonaler Lichtstreif)
  x.fillStyle = lin(q[0][0], q[0][1], q[2][0], q[2][1], [[0, "rgba(255,255,255,0)"], [.45 + light * .1, DARK ? "rgba(140,230,240,.18)" : "rgba(255,255,255,.65)"], [.62, "rgba(255,255,255,0)"]]);
  x.fillRect(0, 0, W, H); x.restore();
}
function towersUp(n, spread) {
  const vx = W * (.5 + (R() - .5) * .3), vy = -H * (1.1 + R());
  const list = [];
  for (let i = 0; i < n; i++) { const cx = W * (-.1 + (i + R() * .6) / n * 1.2), w = W / n * (spread + R() * .5); list.push([cx, cx + w, .55 + R() * .5]); }
  list.sort((a, b) => Math.abs((a[0] + a[1]) / 2 - vx) < Math.abs((b[0] + b[1]) / 2 - vx) ? 1 : -1);
  list.forEach(([l, r, t], i) => tower(l, r, t, H * 1.02, vx, vy, .9, R()));
}
/* Isometrische Glasplatte mit Netzwerk */
const ISO = (gx, gy, gz, s, ox, oy) => [ox + (gx - gy) * s * .866, oy + (gx + gy) * s * .5 - gz * s];
function slab(cx, cy, s, z, w, d) {
  const p = (a, b, cz) => ISO(a, b, z + cz, s, cx, cy);
  const top = [p(0, 0, .12), p(w, 0, .12), p(w, d, .12), p(0, d, .12)];
  const front = [p(w, 0, 0), p(w, d, 0), p(w, d, .12), p(w, 0, .12)], side = [p(0, d, 0), p(w, d, 0), p(w, d, .12), p(0, d, .12)];
  [[front, DARK ? "rgba(30,120,150,.35)" : "rgba(170,205,218,.55)"], [side, DARK ? "rgba(20,90,120,.35)" : "rgba(195,222,232,.6)"], [top, DARK ? "rgba(90,200,220,.16)" : "rgba(255,255,255,.62)"]].forEach(([f, col]) => {
    x.beginPath(); f.forEach((q, i) => i ? x.lineTo(...q) : x.moveTo(...q)); x.closePath(); x.fillStyle = col; x.fill(); x.strokeStyle = rgba(TEAL, DARK ? .7 : .55); x.lineWidth = 1.2; x.stroke(); });
  return (a, b) => p(a * w, b * d, .12);
}
function network(pt, nodes) {
  x.strokeStyle = rgba(TEAL, DARK ? .85 : .75); x.lineWidth = 1.6;
  const P2 = nodes.map(([a, b]) => pt(a, b));
  [[0, 1], [1, 2], [1, 3], [3, 4], [2, 5], [4, 5]].forEach(([i, j]) => { if (P2[i] && P2[j]) { x.beginPath(); x.moveTo(...P2[i]); x.lineTo(P2[i][0], P2[j][1]); x.lineTo(...P2[j]); x.stroke(); } });
  P2.forEach(q => { x.save(); x.shadowColor = rgba(TEAL, .8); x.shadowBlur = DARK ? 14 : 6; x.fillStyle = DARK ? rgba(CY, .95) : "#fff"; x.beginPath(); x.rect(q[0] - 7, q[1] - 5, 14, 10); x.fill(); x.strokeStyle = rgba(TEAL, .9); x.stroke(); x.restore(); });
}
function rack(rx, ry, rw, rh) {
  x.fillStyle = lin(rx, 0, rx + rw, 0, [[0, "#0e2238"], [1, "#081628"]]); x.fillRect(rx, ry, rw, rh);
  for (let u = 0; u < 18; u++) { const y = ry + 10 + u * (rh - 20) / 18; x.fillStyle = "rgba(255,255,255,.06)"; x.fillRect(rx + 8, y, rw - 16, (rh - 20) / 18 - 4);
    for (let l = 0; l < 3; l++) { x.fillStyle = R() > .4 ? rgba(CY, .9) : "rgba(255,180,80,.8)"; x.fillRect(rx + rw - 22 + l * 5, y + 4, 2.5, 2.5); } }
}
function heroLight() {
  sky(); glowAt(W * .75, H * .1, W * .6, [255, 255, 255], .9);
  // Hintergrund: Glasfassaden
  x.globalAlpha = .55; towersUp(8, .55); x.globalAlpha = 1;
  x.fillStyle = lin(0, H * .55, 0, H, [[0, "rgba(248,249,250,0)"], [1, "rgba(248,249,250,.95)"]]); x.fillRect(0, 0, W, H);
  // Vordergrund: Glasplatten mit Systemlandschaft
  const s = W / 13;
  const p1 = slab(W * .47, H * .58, s, 0, 3.2, 2.6), p2 = slab(W * .47, H * .58, s, 1.15, 3.2, 2.6), p3 = slab(W * .47, H * .58, s, 2.3, 3.2, 2.6);
  network(p3, [[.15, .2], [.45, .35], [.8, .2], [.3, .75], [.65, .85], [.9, .6]]);
  network(p2, [[.2, .3], [.5, .5], [.85, .3], [.25, .8], [.6, .8], [.9, .75]]);
  // Serverschränke rechts
  rack(W * .86, H * .22, W * .07, H * .66); rack(W * .935, H * .18, W * .07, H * .72);
  // Bodenreflexion
  x.fillStyle = lin(0, H * .86, 0, H, [[0, "rgba(255,255,255,0)"], [1, "rgba(255,255,255,.8)"]]); x.fillRect(0, H * .86, W, H * .14);
  fadeLeft(.42);
}
function heroDark() {
  sky(); glowAt(W * .62, H * .42, W * .55, TEAL, .22);
  const s = W / 12, ox = W * .6, oy = H * .5;
  x.strokeStyle = rgba(TEAL, .14); x.lineWidth = 1;
  for (let i = -6; i <= 6; i++) { let a = ISO(i, -6, 0, s, ox, oy), b = ISO(i, 6, 0, s, ox, oy); x.beginPath(); x.moveTo(...a); x.lineTo(...b); x.stroke(); a = ISO(-6, i, 0, s, ox, oy); b = ISO(6, i, 0, s, ox, oy); x.beginPath(); x.moveTo(...a); x.lineTo(...b); x.stroke(); }
  for (let z = 0; z < 3; z++) { const pt = slab(ox, oy, s * .95, z * 1.25, 3, 3); if (z) network(pt, [[.15, .2], [.5, .35], [.85, .2], [.3, .75], [.65, .85], [.9, .6]]); }
  for (let i = 0; i < 80; i++) { x.fillStyle = rgba(CY, R() * .5); x.beginPath(); x.arc(R() * W, R() * H, R() * 1.5, 0, 7); x.fill(); }
  fadeLeft(.3);
}
function cardTowers() { sky(); glowAt(W * .8, 0, W * .7, DARK ? TEAL : [255, 255, 255], DARK ? .18 : .9); towersUp(5 + Math.floor(R() * 3), .6); fadeLeft(.35); }
function cardCurve() {
  sky(); glowAt(W * .7, H * .2, W * .6, DARK ? TEAL : [255, 255, 255], DARK ? .2 : .9);
  for (let i = 0; i < 14; i++) { x.beginPath(); x.ellipse(W * 1.05, H * 1.2, W * (.25 + i * .05), H * (.8 + i * .06), -.2, Math.PI, Math.PI * 1.5);
    x.strokeStyle = DARK ? `rgba(120,220,235,${.08 + i * .015})` : `rgba(110,150,170,${.2 + i * .03})`; x.lineWidth = 10 - i * .5; x.stroke(); }
  fadeLeft(.5);
}
function streaks() {
  sky(); glowAt(W * .8, H * .6, W * .5, TEAL, DARK ? .22 : .08);
  for (let i = 0; i < 70; i++) { const y0 = H * (.3 + R() * .5), y1 = H * (.35 + R() * .5), warm = R() > .68;
    const col = warm ? [255, 140, 70] : TEAL;
    x.strokeStyle = lin(0, 0, W, 0, [[0, rgba(col, 0)], [.75, rgba(col, .2 + R() * .55)], [1, rgba(col, .05)]]); x.lineWidth = .6 + R() * 2.4;
    x.beginPath(); x.moveTo(W * .15, y0); x.bezierCurveTo(W * .5, y0, W * .62, y1, W * 1.05, y1 - H * .25 * R()); x.stroke(); }
  fadeLeft(.45);
}
function wave() {
  sky();
  for (let r = 0; r < 36; r++) for (let k = 0; k < 96; k++) { const u = k / 96, v = r / 36;
    const px = W * (.25 + u * .8), py = H * (.15 + v * .75) + Math.sin(u * 7 + v * 3) * H * .12 * (.5 + u), a = Math.max(0, u - .1) * (1 - Math.abs(v - .5)) * 1.4;
    x.fillStyle = rgba(DARK ? CY : TEAL, Math.min(.85, a)); x.beginPath(); x.arc(px, py, .8 + u * 1.3, 0, 7); x.fill(); }
  glowAt(W * .85, H * .5, W * .4, TEAL, DARK ? .16 : .05);
}
({ "hero-light": heroLight, "hero-dark": heroDark, towers: cardTowers, curve: cardCurve, streaks, wave })[K]();
document.title = "done";
</script></body></html>
